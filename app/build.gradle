apply plugin: "com.android.application"

android {
    namespace "net.slickerius"
    compileSdk 36

    defaultConfig {
        applicationId "net.slickerius"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "net.slickerius.ProxyIntegrationInstrumentation"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
